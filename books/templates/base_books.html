{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>   
        <meta charset="UTF-8">   
        <meta name="viewport" content="width=devicewidth, initial-scale=1.0">   
        <title>     
            {% block title %}My Django App{% endblock %}      
        </title> 

         <!-- Reference CSS files -->
        <link rel="stylesheet" href="{% static '/css/bootstrap.min.css' %}" />
        <!-- link to CSS file in the static dir -->
         <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    </head> 

    <body>   
        <header><nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">            
                    <a class="nav-link" href="{% url 'index' %}">Home</a>    
                </li><li class="nav-item">
                    <a class="nav-link" href="{% url 'about' %}">About</a>
                </li><li class="nav-item">
                    <a class="nav-link" href="{% url 'create_book' %}">Create</a>
                </li><li class="nav-item">    
                    <a class="nav-link" href="{% url 'library_view' %}">Data</a>
                </li><li class="nav-item">    
                    <a class="nav-link" href="{% url 'search' %}">Search</a>  
                </li></ul></div></nav></header>  
        <main> 
            <!--add padding around text on pages-->
            <div class="container py-4 px-5">   
            {% block content %}{% endblock %} 
            </div>

            <!-- Reference JavaScript files -->
            <script src="{% static '/js/bootstrap.min.js' %}"></script> 
        </main> </body> </html>
