{% extends 'base_books.html' %}
{% load static %}
{% block title %}Add Book{% endblock %}
{% block content %}
<h1>Search Your List of Books</h1>

<form method="POST">
    {% csrf_token %}
    <div>
        <label for="title">Title:</label>
        <input type="text" id="title"
        name="title" value="{{ title_query }}" />
    </div>
    <div>
        <label for="author">Author:</label>
        <input type="text" id="author"
        name="author" value="{{ author_query }}" />
    </div>
    <bu on type="submit" class="btn btn-primary">Search Contact</bu on>
 </form>

<!-- Reference JavaScript files -->
<script src="{% static '/js/bootstrap.min.js' %}"></script> 

{% endblock %}
